apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-controller-manager
  namespace: cloudflare-system
  labels:
    app: cloudflare-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-controller-manager
  template:
    metadata:
      labels:
        app: cloudflare-controller-manager
    spec:
      serviceAccountName: cloudflare-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: cloudflare-controller:latest
          args:
            - --config=/etc/cloudflare-controller/config.yaml
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-controller-token
                  key: CLOUDFLARE_API_TOKEN
          volumeMounts:
            - name: controller-config
              mountPath: /etc/cloudflare-controller
              readOnly: true
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 10
      volumes:
        - name: controller-config
          configMap:
            name: cloudflare-controller-config
