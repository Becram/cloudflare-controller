apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudflare-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml

# Mount controller-config.yaml as a ConfigMap
configMapGenerator:
  - name: rector-controller-config
    files:
      - config.yaml=controller-config.yaml
    options:
      disableNameSuffixHash: true

# CLOUDFLARE_API_TOKEN — populate secret.env before applying.
# Never commit a real token; use CI/CD secret injection or a secrets manager.
secretGenerator:
  - name: rector-cloudflare-token
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true

images:
  - name: rector-controller
    newName: rector-controller
    newTag: latest
